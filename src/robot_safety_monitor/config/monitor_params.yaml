# Runtime parameters for the robot_safety_monitor node.
#
# Dotted names under /robot_safety_monitor. Load with:
#   ros2 run robot_safety_monitor monitor --ros-args --params-file <this file>
#
# The defaults here match the analyzer defaults and the Gazebo TurtleBot3
# setup, so this file documents the tuned baseline rather than changing it.
/**:
  ros__parameters:
    # --- identity -----------------------------------------------------------
    robot_id: turtlebot3_burger
    world_name: turtlebot3_world

    # --- output -------------------------------------------------------------
    publish_rate_hz: 10.0
    # True when /clock drives the node clock (Gazebo, rosbag with sim time).
    expect_sim_time: true
    # Window used to estimate the measured arrival rate of each topic.
    rate_window_sec: 5.0

    # --- monitored topics ---------------------------------------------------
    # Set a topic to "" to declare the source absent on this platform.
    topic.odom: /odom
    topic.scan: /scan
    topic.imu: /imu
    topic.joint_states: /joint_states
    topic.cmd_vel: /cmd_vel
    topic.battery: ""
    # The Gazebo TurtleBot3 publishes no battery topic, so battery monitoring
    # is off by default; enabling it without a publisher yields a permanent
    # BATTERY_STALE finding by design.
    battery.monitor: false
    # Command monitoring is ON by default: a commander that was running and then
    # went quiet is a fault the safety layer must see, and the monitor is often
    # started before any teleop exists. Set this to false only on a platform that
    # genuinely has no velocity commander, where the source is then excluded from
    # the health assessment instead of being reported as failing.
    command.monitor: true

    # --- watchdog timeouts [s], measured on the wall clock ------------------
    timeout.odom_sec: 1.0
    timeout.scan_sec: 1.0
    timeout.imu_sec: 1.0
    timeout.joint_states_sec: 2.0
    timeout.cmd_vel_sec: 1.0
    timeout.battery_sec: 5.0

    # --- battery thresholds [state of charge 0..1] --------------------------
    battery.warn_fraction: 0.30
    battery.critical_fraction: 0.15

    # --- attitude thresholds [deg] ------------------------------------------
    # 15 deg is a reasonable "climbing / tipped" hint for a small diff-drive
    # base; 45 deg means it is almost certainly not on its wheels.
    tilt.warn_deg: 15.0
    tilt.critical_deg: 45.0

    # --- lidar proximity thresholds [m] -------------------------------------
    # The front sector is the ground the robot is about to occupy.
    front_sector_half_angle_rad: 0.35
    obstacle.warn_range_m: 0.30
    obstacle.critical_range_m: 0.15

    # --- odometry plausibility ---------------------------------------------
    odom.pose_cov_warn: 0.05
    odom.twist_cov_warn: 0.05

    # --- intent vs execution ------------------------------------------------
    command.deadband_linear: 0.02
    command.deadband_angular: 0.10
    command.tolerance_fraction: 0.5
    command.motion_threshold: 0.01

    # --- drivetrain activity ------------------------------------------------
    joints.velocity_threshold: 0.001
    # --- motion safety: RSS-003 §1, category MOT ----------------------------
    # Implemented rules in this phase: MOT-001 .. MOT-004. The remaining MOT
    # rules (005, 009, 010, 011, 012) are registered as deferred in RSS-003 §8.
    #
    # Every threshold here has a calibration source, because RSS-001 §14.2
    # requires each one to trace to: standard / manufacturer / measurement /
    # risk assessment. The values below are TurtleBot3 Burger manufacturer
    # ratings; RSS-003 §0 marks the MOT-004 geometry as "measured", i.e. W and
    # r_wheel must be measured before that rule can be trusted.

    # MOT-001 / MOT-002: commanded speed limits (manufacturer rating)
    mot.max_linear_mps: 0.22
    mot.max_angular_rps: 2.84

    # MOT-001 / MOT-002: measured speed limits -> S4.
    # Deliberately looser than the commanded limits: these exist to catch a
    # physically runaway base, not control overshoot, so they must not fire on
    # odometry noise. Command vs measured is the point of these two rules.
    mot.max_actual_linear_mps: 0.30
    mot.max_actual_angular_rps: 3.50

    # MOT-003: acceleration limits for a single command frame
    mot.max_linear_accel_mps2: 0.50
    mot.max_angular_accel_rps2: 3.00
    # Interval floor for the finite difference. Without it, two command frames
    # arriving almost together produce a phantom acceleration and the rule
    # misfires; RSS-003 MOT-003 calls this out explicitly.
    mot.min_accel_dt_sec: 0.020

    # MOT-004: differential-drive geometry and single-wheel limit.
    # v_wheel_max equals the rated linear speed so that the rated speed stays
    # reachable at zero yaw rate. Measure W and r_wheel before trusting the
    # reachability verdict -- an inaccurate pair makes it wrong both ways.
    mot.wheel_separation_m: 0.160
    mot.wheel_radius_m: 0.033
    mot.max_wheel_speed_mps: 0.22

    # MOT-001..004 are statements about the commanded value, so they only apply
    # while a fresh command exists. RSS-003 §0 sets this to 0.50 s (CMD-007).
    mot.command_timeout_sec: 0.50
